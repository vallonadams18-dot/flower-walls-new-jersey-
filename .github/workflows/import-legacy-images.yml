name: Import legacy images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx --yes playwright@latest install --with-deps chromium
      - run: npm i --no-save playwright@latest
      - run: node scripts/import-legacy-images.mjs
      - name: Commit imported images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/legacy
          git diff --cached --quiet || git commit -m "Import legacy homepage images from the old WordPress site"
          git push

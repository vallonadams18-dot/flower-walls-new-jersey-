name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The cutover switch.
      #
      # Set a repository variable named PRODUCTION_DOMAIN (Settings →
      # Secrets and variables → Actions → Variables) to
      # www.flowerwallsnewjersey.com when the domain is ready to move.
      #
      # Unset  → preview build, served from /flower-walls-new-jersey-/ on
      #          github.io, no custom domain.
      # Set    → production build, served from the root of the custom domain,
      #          with the CNAME file GitHub Pages needs to hold that domain.
      #
      # Flipping it back to unset reverts to the preview. No code change,
      # nothing destructive, one setting.
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.PRODUCTION_DOMAIN == '' && '/flower-walls-new-jersey-' || '' }}

      - name: Write CNAME for the custom domain
        if: vars.PRODUCTION_DOMAIN != ''
        run: echo "${{ vars.PRODUCTION_DOMAIN }}" > ./out/CNAME

      - name: Fail the build if the export is not cutover-ready
        if: vars.PRODUCTION_DOMAIN != ''
        run: node scripts/audit-cutover.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
